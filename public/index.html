<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Rent a Vehicle</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">

    <header class="topbar">
      <h1 class="topbar__title">Rent a vehicle</h1>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Refresh list">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </header>

    <main class="content">

      <!-- The two main actions -->
      <section class="actions" aria-label="Main actions">
        <a href="find.html" class="action action--find">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </span>
          <span class="action__label">Find Vehicle</span>
          <span class="action__hint">Rent a ride nearby</span>
        </a>
        <a href="myvehicle.html" class="action action--list">
          <span class="action__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
          </span>
          <span class="action__label">List Vehicle</span>
          <span class="action__hint">Earn from your vehicle</span>
        </a>
      </section>

      <!-- Quick search + type filter (filters the list below) -->
      <section class="filters" aria-label="Quick filters">
        <label class="search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="quickSearch" type="search" placeholder="Search name, brand or area" autocomplete="off" aria-label="Search vehicles">
        </label>
        <div class="chips" id="chips" role="tablist" aria-label="Vehicle type">
          <button class="chip is-active" type="button" data-type="">All</button>
          <button class="chip" type="button" data-type="Bike">Bike</button>
          <button class="chip" type="button" data-type="Scooter">Scooter</button>
          <button class="chip" type="button" data-type="Car">Car</button>
          <button class="chip" type="button" data-type="Electric Scooter">E-Scooter</button>
          <button class="chip" type="button" data-type="Electric Bike">E-Bike</button>
          <button class="chip" type="button" data-type="Cycle">Cycle</button>
        </div>
      </section>

      <section aria-labelledby="listHeading">
        <div class="list-head">
          <h2 id="listHeading">Vehicles</h2>
          <a href="find.html" class="link">See all</a>
        </div>

        <div id="loadingState" class="skeletons" aria-live="polite" aria-label="Loading vehicles">
          <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>

        <div id="errorState" class="state d-none">
          <div class="state__icon" aria-hidden="true">⚠️</div>
          <h3>Couldn't load vehicles</h3>
          <p id="errorMessage">Check your connection and try again.</p>
          <button id="retryBtn" class="btn" type="button">Try again</button>
        </div>

        <div id="emptyState" class="state d-none">
          <div class="state__icon" aria-hidden="true">🚗</div>
          <h3 id="emptyTitle">No vehicles yet</h3>
          <p id="emptyMessage">Be the first to list one.</p>
          <a href="myvehicle.html" class="btn" id="emptyCta">List Vehicle</a>
        </div>

        <ul id="vehicleList" class="vlist d-none"></ul>
      </section>

      <p class="admin-link"><a href="admin.html">Admin</a></p>
    </main>

    <!-- App-style bottom navigation -->
    <nav class="tabbar" aria-label="Main">
      <a href="index.html" class="tab is-active" aria-current="page">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Home</span>
      </a>
      <a href="find.html" class="tab">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <span>Find</span>
      </a>
      <a href="myvehicle.html" class="tab">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span>List</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
